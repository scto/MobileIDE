name: MobileIDE CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-assemble:
    name: Lint & Assemble APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build & Lint APK (Fdroid Debug)
        run: |
          ./gradlew :app:assembleFdroidDebug :app:lintFdroidDebug \
            --init-script ci-init.gradle \
            -Pandroid.aapt2FromMavenOverride=""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileIDE-FdroidDebug-APK
          path: app/build/outputs/apk/Fdroid/debug/*.apk

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testFdroidDebugUnitTest \
            --init-script ci-init.gradle \
            -Pandroid.aapt2FromMavenOverride=""

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: '**/build/reports/tests/'

  module-dependency-check:
    name: Module Dependency Boundaries Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Check Dependencies & Architecture Boundaries
        run: |
          ./gradlew :app:dependencies \
            --init-script ci-init.gradle \
            -Pandroid.aapt2FromMavenOverride="" > gradle-deps.log
          
          echo "Verifying no circular dependencies between feature modules..."
          if grep -i "circular" gradle-deps.log; then
            echo "❌ Error: Circular dependency detected in Gradle tree!"
            exit 1
          else
            echo "✅ Module dependency boundaries are clean."
          fi

  catalog-consistency:
    name: Verify Catalog Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run verifyCatalogConsistency Task
        run: |
          ./gradlew verifyCatalogConsistency \
            --init-script ci-init.gradle \
            -Pandroid.aapt2FromMavenOverride=""
